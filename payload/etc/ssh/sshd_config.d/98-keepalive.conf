# ---------------------------------------------------------------------------
# 98-keepalive.conf —— 让 SSH 会话别莫名其妙断
#
# 本机的 SSH 主要走 USB 网络（RNDIS/NCM 的 169.254.42.1）。USB 链路偶尔会
# 静默丢包、或者笔记本休眠唤醒，如果没有保活，会话会在中途"卡住不动"
# （TCP 半开），得等内核超时才释放。
#
# 60 秒探活 × 10 次 = 最多 10 分钟无响应才判定断开；同时对端（笔记本）也能
# 借这个探活发现链路死了。
#
# 注意 /etc/ssh/sshd_config.d/*.conf 只在主配置里有 Include 时才会被读
# （Ubuntu 24.04 默认有；initramfs 也是往这里写 99-cepheus.conf 的）。
# ---------------------------------------------------------------------------
ClientAliveInterval 60
ClientAliveCountMax 10
TCPKeepAlive yes
