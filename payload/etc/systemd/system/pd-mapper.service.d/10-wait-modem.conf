# ---------------------------------------------------------------------------
# pd-mapper 必须等 modem 起来才能工作（2026-10-18 实测）
#
# 原单元（/usr/local/lib/systemd/system/pd-mapper.service）是 Restart=always，
# 但没解除 systemd 的启动频率限制。开机时 modem 还没起来，pd-mapper 只报
#     no pd maps available
# 就 exit 1；连试 5 次后 systemd 判定
#     Start request repeated too quickly
# 单元直接进入 failed，而且**此后不会再试**（wifi-up 里手动 systemctl start
# 也会被这句拒掉）。结果：modem 一直拿不到自己的 PD 固件定位。
#
# 修法：干脆不设启动频率限制，失败就每 10 秒重试一次，modem 一就绪自然就成功了。
# ---------------------------------------------------------------------------
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
