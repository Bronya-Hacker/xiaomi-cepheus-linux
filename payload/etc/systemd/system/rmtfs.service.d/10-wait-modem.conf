# ---------------------------------------------------------------------------
# rmtfs 也必须等 modem 起来（2026-10-18 实测）
#
# modem 没起来时 rmtfs 报
#     Failed to get rprocfd
# 然后退出（它要 modem 的 remoteproc fd 才能读到 EFS 分区）。
# 和 pd-mapper 一样，失败次数多了会被 systemd 的启动频率限制永久锁死。
#
# 修法同上：不设启动频率限制，失败就每 10 秒重试，modem 一就绪就成功。
# ---------------------------------------------------------------------------
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=10
