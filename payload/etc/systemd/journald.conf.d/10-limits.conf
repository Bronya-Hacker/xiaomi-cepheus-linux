# ---------------------------------------------------------------------------
# 10-limits.conf —— 给 systemd-journald 戴上笼头
#
# 为什么（2026-10-19 实测）：rootfs 是别人镜像，journald 用默认策略
# （SystemMaxUse=10% of filesystem），在这台 110G 的机器上意味着最多能吃掉
# **11G**；实测已经攒到 **663MB** 且还在涨。日志对服务器有用，但没上限的
# 日志会把磁盘写满、也会让 UFS 一直写（寿命）。
#
# 768M 对本机足够：平时只有几十 MB，出问题时 768M 也能存下很多轮 dmesg。
# 想临时看更久的历史：journalctl --disk-usage / journalctl --vacuum-size=256M
# ---------------------------------------------------------------------------
[Journal]
Storage=persistent
SystemMaxUse=768M
SystemMaxFileSize=64M
RuntimeMaxUse=64M
MaxRetentionSec=2week
