# ---------------------------------------------------------------------------
# 50-server.conf —— 本机自 2026-10-19 起当作**服务器**用（无 GUI、纯 SSH/命令行）
#
# 为什么需要它（docs/root-cause.md §10.15）：
#   systemd-logind 的默认策略是 HandlePowerKey=poweroff —— 也就是说**按一下电源键
#   就整机关机**。手机没键盘、屏幕也不常看，这种"误触即断电"对服务器是灾难
#   （2026-10-19 实测：按电源键直接 poweroff，只能靠串口/长按重启救回来）。
#   这里把电源/音量类与合盖(hall)事件全部改成 ignore：由用户态自己决定怎么处理。
#
# 注意：文件必须放在 logind.conf.d/ 下（片段目录），别直接改 /etc/systemd/logind.conf。
# 生效方式：systemctl restart systemd-logind（或重启）。
# ---------------------------------------------------------------------------
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
