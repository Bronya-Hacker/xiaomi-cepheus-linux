# ---------------------------------------------------------------------------
# 10-cn.conf —— 把 NTP 换成国内可用的服务器
#
# 默认（ntp.ubuntu.com）在这条网络里经常要等很久甚至不通，而本机"开机时间靠
# NTP 纠正"是常态（PMIC RTC 只在 rtc-save.sh 写过的前提下才准；见 §10.13/§10.16F），
# 所以时间同步得快、得稳。
# 三个阿里 + 一个 Ubuntu 兜底；都不是必需的，取到就跳下一次。
# ---------------------------------------------------------------------------
[Time]
NTP=ntp.aliyun.com ntp1.aliyun.com ntp2.aliyun.com
FallbackNTP=ntp.ubuntu.com
