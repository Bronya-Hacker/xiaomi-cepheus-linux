# ---------------------------------------------------------------------------
# 20-watchdog.conf —— systemd 托管 qcom_wdt 硬件看门狗（服务器自愈）
#
# 2026-10-19 服务器化。systemd 打开 /dev/watchdog0 后能自动喂狗
# （RuntimeWatchdogSec/2 一次）；内核真死锁时硬件直接复位。本机确实踩过
# 死锁场景：读 /sys/kernel/debug/clk/clk_summary 会卡住某个全局锁，整机失去
# 响应、SSH 断开，只能跑过去长按电源键（见 docs/root-cause.md §10.15）。
# 有了看门狗，这类情况会自己重启（2026-10-19 实测：故意打开 watchdog 不喂，
# 约 1 分钟后手机自动复位，起来后一切正常）。
#
# ★★ 这个文件必须带 [Manager] 段头！★★
#   2026-10-19 实测：只有注释 + 赋值、没有 [Manager] 时，systemd 只打一行
#     "/etc/systemd/system.conf.d/20-watchdog.conf:5: Assignment outside of
#      section. Ignoring."
#   然后**静默失效**（RuntimeWatchdogUSec 一直是 0），很容易以为开好了。
#
# 关闭办法：删掉本文件 + systemctl daemon-reexec，
#           或在内核 cmdline 加 nowatchdog（更彻底，驱动都不注册）。
# ---------------------------------------------------------------------------
[Manager]
RuntimeWatchdogSec=60s
RebootWatchdogSec=60s
ShutdownWatchdogSec=60s
