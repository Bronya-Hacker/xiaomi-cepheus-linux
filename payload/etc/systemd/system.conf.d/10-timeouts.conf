# /etc/systemd/system.conf.d/10-timeouts.conf
#
# 为什么放宽启动超时（2026-10-18 实测）：
#   这台设备冷启动可能非常慢（UFS + ext4 + 一堆 Ubuntu 后台服务），默认 90 秒的
#   启动超时会把 dbus.service / systemd-logind / usb-net.service / dev-ttyGS0.device
#   这类单元打成 failed；其中 **dbus 失败会连带 NetworkManager 的依赖作业失败**，
#   而 systemd 不会重试依赖失败的作业 → NM 永远不会启动 → wlan0 永远连不上。
#   表现：`systemd-analyze blame` 头一行是 `9min … dev-sda31.device`，同一秒
#   dbus / logind / usb-net / ttyGS0 的超时一起爆发，而 dbus 第二次尝试 1 秒就成功。
#   （那次慢的真凶是 console=ttyGS0 的 printk 阻塞，已在 06 脚本里去掉；这里是
#    防御性措施：宁可某个单元慢 5 分钟，也不要连锁失败把 WiFi 弄没。）
[Manager]
DefaultTimeoutStartSec=300
DefaultTimeoutStopSec=180
