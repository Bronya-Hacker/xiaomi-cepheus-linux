# 打开完整 Magic SysRq（2026-10-19 服务器化）
#
# 为什么（救援手段）：这机器没有键盘，串口（ttyGS0）是最后的救命通道。
#   sysrq=1 之后，串口上先发一个 BREAK 再发一个字母就是一条 SysRq 命令：
#       b = 立刻重启（不落盘）      s = 同步所有文件系统（先 s 再 b 更安全）
#       o = 关机                    r = 收回键盘（解锁 X 抢键事故）
#   2026-10-19 掉 root SSH 那次就是靠串口进去用普通用户救回来的，有 sysrq 会快得多。
# 代价：本机 tty1 是 getty 免密自动登录（umeko），意味着物理接触者能重启机器；
#       这台机器本来就是自己的玩具设备，换来的救援能力更值。
kernel.sysrq=1
