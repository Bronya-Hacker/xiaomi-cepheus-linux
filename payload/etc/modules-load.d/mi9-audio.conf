# 音频模块依赖链
#
# 为什么需要这个文件：q6asm_dai 不会自动加载。apr-service@7:dais 这个平台设备
# 的 modalias 没能触发 udev 加载 q6asm_dai，结果声卡注册时找不到 "MultiMedia1"
# 这个 CPU DAI：
#     platform sound: deferred probe pending: snd-sm8150: MultiMedia1:
#                     error getting cpu dai name
# 手动 modprobe q6asm_dai 后声卡立刻注册、1032 个混音器控件全部出现。
# 所以这里显式按依赖顺序列出来，别再依赖 modalias 自动加载。
#
# 顺序：ASoC 核心 → QDSP6 服务 → codec → 声卡
snd
snd_timer
snd_pcm
snd_compress
snd_soc_core
snd_soc_qcom_common

# QDSP6 (ADSP) 侧
q6core
q6afe
q6asm
q6adm
q6afe_clocks
q6afe_dai
q6asm_dai
q6routing

# SLIMbus + WCD9340 codec
slim_qcom_ngd_ctrl
regmap_slimbus
soundwire_qcom
wcd934x
snd_soc_wcd_classh
snd_soc_wcd_mbhc
snd_soc_wcd934x
gpio_wcd934x

# 扬声器功放 CS35L41（i2c4 / 0x40）
snd_soc_wm_adsp
snd_soc_cs35l41_lib
snd_soc_cs35l41
snd_soc_cs35l41_i2c

# 机器驱动（声卡本体）
snd_soc_sm8150
