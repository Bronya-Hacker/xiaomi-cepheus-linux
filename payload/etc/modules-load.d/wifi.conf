# 否则 probe 会以 -517(EPROBE_DEFER) 直接失败（就是日志里那条
# "failed to register wlfw qmi client: -517"）。
#
# 注意：qcom_q6v5_pas 与 ath10k_snoc 故意**不**放这里，
