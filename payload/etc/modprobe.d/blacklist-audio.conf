# ---------------------------------------------------------------------------
# 音频先不启用（2026-10-18，第①项"内核报错清零"）
#
# q6asm-dai 驱动 probe 时要求 DTS 里有 dais 子节点（sound/soc/qcom/qdsp6/q6asm-dai.c
# 里是 of_get_child_count(dev->of_node)），我们的 DTS 没有把音频那一整套接起来，
# 所以每次开机必刷两条 err：
#     q6asm-dai ...:dais: No dais found in DT
#     q6asm-dai ...:dais: probe with driver q6asm-dai failed with error -22
#
# 音频不在本轮范围 → 先按模块名屏蔽（cmdline 里还有一份 modprobe.blacklist 双保险）。
# ★ 以后做音频那一关时要删掉这个文件 + 删 cmdline 里的 modprobe.blacklist。
# ---------------------------------------------------------------------------
blacklist q6asm_dai
