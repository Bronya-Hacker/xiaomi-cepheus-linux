# /etc/mi9-screen.conf —— 屏幕空闲超时（手机"息屏时间"的等价物）
#
# 亮屏后这么久没有任何输入（电源键 / 音量键 / 触屏）就自动熄屏；
# 任何输入都会把计时清零重来。
#
#   60  = 一分钟（默认，与开机 60 秒熄屏一致）
#   300 = 五分钟
#   0   = 关闭空闲熄屏（只有电源键能切换；开机那次也不熄）
#
# 改完不用重启：mi9-screend 每次空闲动作前都会重读这个文件，
# 但首次计时用的是启动时读到的值 —— 想让新值立刻生效执行
#   systemctl restart mi9-pwrkey
SCREEN_TIMEOUT=60
